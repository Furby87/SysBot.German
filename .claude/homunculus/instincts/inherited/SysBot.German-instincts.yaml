1. Update all *.csproj files for each platform (Discord, Twitch, WinForms, YouTube, Z3, Base, Tests, etc.)
2. Replace DLLs in deps/ (e.g., PKHeX.Core.AutoMod.dll, PKHeX.Drawing.dll, PKHeX.Drawing.PokeSprite.dll)
3. Optionally update helper files if dependency APIs changed (e.g., AutoLegalityWrapper.cs)
4. Commit with a message indicating the new dependency version

